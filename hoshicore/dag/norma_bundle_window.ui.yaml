inputs:
  fnames:
    label: "图像文件"
    description: "同一相机拍摄的延时序列。Norma 联合求解全序列，再以各中心帧为参考执行滑窗对齐与叠加。"
    widget: file_picker
    accept: ".cr2,.cr3,.arw,.nef,.dng,.rw2,.orf,.raf,.tiff,.tif,.jpeg,.jpg,.png,.bmp,.fits"

routes:
  window_stacker:
    label: "窗口叠加算法"
    widget: tabs
    options:
      mean:
        label: "均值"
        description: "速度快、信噪比高，但不排除窗口内的异常像素。"
      max:
        label: "最大值"
        description: "逐像素保留窗口内最大值，适合需要保留所有飞机/卫星轨迹的场景。"
      median:
        label: "中位数"
        description: "逐像素取中位数，天然排异。适合较小窗口内的稳健降噪。"
      sigma_clip:
        label: "Sigma 裁剪"
        description: "迭代排除异常值后求平均。适合有卫星/飞机线或其他异常值干扰，且叠加图像张数较多(>10张)的场景。"

  ground_window_stacker:
    label: "地景窗口叠加算法"
    widget: tabs
    visible_when:
      all:
        - { key: "enable_ground", eq: true }
    options:
      mean: { label: "均值" }
      max: { label: "最大值" }
      median: { label: "中位数" }
      sigma_clip: { label: "Sigma 裁剪" }

configs:
  reference_frame_index:
    label: "BA 参考帧序号"
    description: "从 0 开始计数，仅定义全局 BA 坐标系；每张输出仍以其窗口中心帧为重映射参考。"
    hidden: true

  lens_type:
    label: "镜头类型"
    description: "自动时从 EXIF 推断；EXIF 不完整时请明确选择标准镜头或鱼眼。"
    widget: select
    options:
      - { value: null, label: "自动（EXIF）" }
      - { value: "perspective", label: "标准镜头" }
      - { value: "fisheye", label: "鱼眼镜头" }

  focal_length_mm:
    label: "镜头焦距（mm）"
    description: "EXIF 不完整时使用的实际焦距。鱼眼镜头允许 BA 从尺度候选进一步修正。"
    widget: input
    visible_when:
      all:
        - { key: "lens_type", neq: null }
    min: 1
    max: 2000

  crop_factor:
    label: "传感器裁切系数"
    description: "全画幅为 1.0；等效焦距 = 实际焦距 × 裁切系数。"
    widget: input
    visible_when:
      all:
        - { key: "lens_type", neq: null }
    min: 0.5
    max: 4.0

  fallback_focal_equiv_mm:
    hidden: true

  optimize_focal:
    label: "联合优化焦距"
    description: "使用全序列匹配共同优化共享焦距。"
    widget: switch

  optimize_distortion:
    label: "联合优化畸变"
    description: "使用全序列匹配共同优化共享畸变；需要足够的边缘星点覆盖。"
    widget: switch

  optimize_principal_point:
    label: "联合优化主点"
    description: "仅在主点存在明确系统偏差时启用，会提高可观测性要求。"
    widget: switch
    hidden: true

  allow_large_principal_point_offset:
    label: "中心偏移"
    description: "允许共享光心在每个图像轴上最多偏移 50%；关闭时默认限制为 5%。仅在已知裁切或明显偏心时开启。"
    widget: switch

  window_size:
    label: "窗口大小"
    description: "每张输出参与叠加的最大帧数，必须为正奇数；序列两端会自动缩小窗口。"
    widget: slider
    min: 1
    max: 31
    step: 2

  ground_window_size:
    label: "地景窗口大小"
    description: "地景不做几何变换，以当前帧为中心使用独立的滑动窗口。"
    widget: slider
    min: 1
    max: 31
    step: 2
    visible_when:
      all:
        - { key: "enable_ground", eq: true }

  mask:
    label: "天空/地景蒙版"
    description: "白色使用天空对齐结果，黑色使用未变换的地景窗口结果。"
    widget: file_picker

  enable_ground:
    label: "启用地景窗口"
    widget: switch

  min_contributors:
    label: "最少贡献帧数"
    description: "有效对齐帧少于该值时跳过对应中心帧。"
    widget: slider
    min: 1
    max: 31
    step: 1
    hidden: true

  ground_min_contributors:
    hidden: true

  remap_map_scale:
    label: "Remap 映射分辨率"
    description: "较低值减少映射构建开销；1.0 使用完整分辨率。"
    widget: slider
    min: 0.1
    max: 1.0
    step: 0.1
    hidden: true

  distortion:
    hidden: true
  pair_offsets:
    hidden: true
  random_seed:
    hidden: true
  loader_type:
    hidden: true
  loader_configs:
    hidden: true
  output_dir:
    hidden: true
  output_template:
    hidden: true
  output_dtype:
    hidden: true
  jpg_quality:
    hidden: true
  png_compressing:
    hidden: true
  max_pairs_per_edge:
    hidden: true
  edge_topology:
    label: "建边拓扑"
    description: "稠密：为 pair_offsets 中每个间隔连接全部符合位置的帧对，边数随间隔数线性增长。多尺度：稀疏交错起点的多尺度拓扑，边数恒定在约 2 倍帧数附近，帧数较多时求解显著更快，但长距离约束更稀疏。"
    widget: select
    options:
      - { value: "dense", label: "稠密（默认）" }
      - { value: "multiscale", label: "多尺度（稀疏，长序列更快）" }
    hidden: true
  max_pair_offset:
    hidden: true

route_configs:
  sigma_clip:
    rej_low:
      label: "暗像素排异阈值（σ）"
      description: "值越小，越积极排除偏暗异常值。"
      widget: slider
      min: 0
      max: 5.0
      step: 0.1
    rej_high:
      label: "亮像素排异阈值（σ）"
      description: "值越小，越积极排除偏亮异常值。"
      widget: slider
      min: 0
      max: 5.0
      step: 0.1
    max_iter:
      label: "最大迭代次数"
      description: "异常值剔除的最大迭代轮数，通常 3–5 次即可。"
      widget: slider
      min: 1
      max: 10
      step: 1

layout:
  groups:
    - name: "参考与相机"
      keys:
        [
          reference_frame_index,
          lens_type,
          focal_length_mm,
          crop_factor,
          fallback_focal_equiv_mm,
        ]
    - name: "联合优化"
      keys:
        [
          optimize_focal,
          optimize_distortion,
          optimize_principal_point,
          allow_large_principal_point_offset,
        ]
    - name: "滑动窗口"
      keys:
        [
          window_size,
          ground_window_size,
          min_contributors,
          remap_map_scale,
          mask,
          enable_ground,
        ]
  order:
    [
      window_stacker,
      ground_window_stacker,
      reference_frame_index,
      lens_type,
      focal_length_mm,
      crop_factor,
      fallback_focal_equiv_mm,
      optimize_focal,
      optimize_distortion,
      optimize_principal_point,
      allow_large_principal_point_offset,
      window_size,
      ground_window_size,
      min_contributors,
      remap_map_scale,
      mask,
      enable_ground,
    ]

outputs:
  - filename_key: output_dir
    label: "输出序列"
    type: sequence
    dtype_key: output_dtype
    formats: ["PNG", "TIFF", "JPG"]
    dtype_options: ["uint8", "uint16"]
    template_key: output_template
