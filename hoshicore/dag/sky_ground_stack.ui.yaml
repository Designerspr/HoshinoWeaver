inputs:
  fnames:
    label: "图像文件"
    widget: file_picker
    accept: ".cr2,.cr3,.arw,.nef,.dng,.rw2,.orf,.raf,.tiff,.tif,.jpeg,.jpg,.png,.bmp,.gif,.fits"

routes:
  sky_stacker:
    label: "天空叠加算法"
    widget: tabs
    options:
      mean:
        label: "均值"
        description: "不排除异常值的平均值叠加，计算快，信噪比高，但容易受到干扰。适合无干扰的干净素材。"
      sigma_clip:
        label: "Sigma 裁剪"
        description: "多轮迭代排除异常值后求平均。适合有卫星/飞机线或其他异常值干扰，且叠加图像张数较多(>10张)的场景。"
      median:
        label: "中位数"
        description: "逐像素取中位数，天然排异。适合有卫星/飞机线或其他异常值干扰，且叠加图像张数偏少(<10张)的场景。"
      huber_mean:
        label: "Huber 均值"
        description: "使用 Huber 损失自动降低异常像素权重。速度较快，适合轻微异常场景"
      max_mix:
        label: "最大值混合"
        description: "在最大值基础上校正空间亮度不均，适合需要保留所有飞机/卫星轨迹的场景。"
      max:
        label: "最大值"
        description: "逐像素取最大值，不做其他处理，适合需要保留所有飞机/卫星轨迹的场景。"
  ground_stacker:
    label: "地面叠加算法"
    widget: tabs
    visible_when: { key: "enable_ground", eq: true }
    options:
      mean:
        label: "均值"
        description: "不排除异常值的平均值叠加，计算快，信噪比高，但容易受到干扰。适合无干扰的干净素材。"
      sigma_clip:
        label: "Sigma 裁剪"
        description: "多轮迭代排除异常值后求平均。适合有卫星/飞机线或其他异常值干扰，且叠加图像张数较多(>10张)的场景。"
      median:
        label: "中位数"
        description: "逐像素取中位数，天然排异。适合有卫星/飞机线或其他异常值干扰，且叠加图像张数偏少(<10张)的场景。"
      huber_mean:
        label: "Huber 均值"
        description: "使用 Huber 损失自动降低异常像素权重。速度较快，适合轻微异常场景"
      max_mix:
        label: "最大值混合"
        description: "逐像素取最大值，并在最大值基础上校正因镜头校正引入的空间亮度不均和高频纹理"
      max:
        label: "最大值"
        description: "逐像素取最大值，不做其他处理"

configs:
  int_weight:
    hidden: true
  output_dtype:
    hidden: true
  output_filename:
    hidden: true
  align_base:
    label: "对齐基准帧"
    description: "天空对齐的参考图像。"
    widget: file_picker
    accept: ".cr2,.cr3,.arw,.nef,.dng,.rw2,.orf,.raf,.tiff,.tif,.jpeg,.jpg,.png,.bmp,.gif,.fits"
  align_method:
    label: "对齐方式"
    description: "透视变换速度快，适合小范围移动且已矫正畸变的图像；畸变校正路径需要 EXIF 或手动焦距，支持畸变联合优化，更精确。"
    widget: select
    options:
      - { value: "homography", label: "透视变换" }
      - { value: "distortion", label: "畸变校正" }
  camera_setup_mode:
    label: "相机信息"
    description: "优先使用自动读取；仅在 EXIF 不完整或参考帧、输入帧来自不同镜头时手动展开。"
    widget: select
    visible_when: { key: "align_method", eq: "distortion" }
    options:
      - { value: "auto", label: "读取 EXIF" }
      - { value: "manual", label: "指定同一相机" }
      - { value: "separate", label: "指定不同相机" }
  lens_type:
    label: "镜头类型"
    description: "参考帧和输入帧共同使用的投影模型。"
    widget: select
    visible_when:
      all:
        - { key: "align_method", eq: "distortion" }
        - { key: "camera_setup_mode", eq: "manual" }
    options:
      - { value: "perspective", label: "标准镜头" }
      - { value: "fisheye", label: "鱼眼镜头" }
  matching_path:
    hidden: true
  ref_lens_type:
    label: "参考帧镜头类型"
    description: "显式指定参考帧投影模型；留空时尝试从参考帧 EXIF 推断。"
    widget: select
    visible_when:
      all:
        - { key: "align_method", eq: "distortion" }
        - { key: "camera_setup_mode", eq: "separate" }
    options:
      - { value: null, label: "自动" }
      - { value: "perspective", label: "透视" }
      - { value: "fisheye", label: "鱼眼" }
  src_lens_type:
    label: "输入帧镜头类型"
    description: "显式指定输入帧投影模型；留空时逐帧从 EXIF 推断。"
    widget: select
    visible_when:
      all:
        - { key: "align_method", eq: "distortion" }
        - { key: "camera_setup_mode", eq: "separate" }
    options:
      - { value: null, label: "自动" }
      - { value: "perspective", label: "透视" }
      - { value: "fisheye", label: "鱼眼" }
  focal_length_mm:
    label: "镜头焦距（mm）"
    description: "EXIF 不完整时使用的实际焦距；不同相机模式下暂作为两侧共同的手动后备值。"
    widget: input
    visible_when:
      all:
        - { key: "align_method", eq: "distortion" }
        - { key: "camera_setup_mode", neq: "auto" }
    min: 1
    max: 2000
  crop_factor:
    label: "传感器裁切系数"
    description: "全画幅 = 1.0，APS-C（尼康/索尼）≈ 1.5，APS-C（佳能）≈ 1.6，M43 ≈ 2.0。等效焦距 = 焦距 × 裁切系数。"
    widget: input
    visible_when:
      all:
        - { key: "align_method", eq: "distortion" }
        - { key: "camera_setup_mode", neq: "auto" }
    min: 0.5
    max: 4.0
  same_camera:
    hidden: true
  mask:
    label: "天空遮罩"
    description: "选择一张白色=天空，黑色=地面的遮罩图像。用绘图软件绘制后导入。"
    widget: file_picker
    accept: ".tif,.tiff,.png,.jpg"
  enable_exif:
    label: "写入 EXIF"
    description: "在输出文件中保留拍摄参数。关闭后输出不含 EXIF 信息"
    widget: switch
  enable_ground:
    label: "叠加地面"
    description: "同时叠加地面区域。关闭后，如果配置了天空遮罩，则仅叠加天空部分；如果未配置天空遮罩，则叠加天空部分时地面也会参与叠加，且会因旋转而拖影。"
    widget: switch
  distortion:
    hidden: true
  exif_reduce_type:
    hidden: true
  loader_type:
    hidden: true
  loader_configs:
    hidden: true
  jpg_quality:
    hidden: true
  png_compressing:
    hidden: true

route_configs:
  "!include": fragments/stacker_route_configs.ui.yaml

layout:
  groups:
    - name: "对齐设置"
      keys: [align_base, align_method, camera_setup_mode, lens_type, ref_lens_type, src_lens_type, focal_length_mm, crop_factor, mask, enable_ground]
    - name: "输出设置"
      keys: [int_weight]
  order: [sky_stacker, ground_stacker, align_base, align_method, camera_setup_mode, lens_type, ref_lens_type, src_lens_type, focal_length_mm, crop_factor, mask, enable_ground, int_weight]

outputs:
  - "!include": fragments/image_output.ui.yaml
