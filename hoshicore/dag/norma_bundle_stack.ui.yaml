inputs:
  fnames:
    label: "图像文件"
    description: "同一相机拍摄的星空序列。Norma 会联合求解相机与各帧指向，并将所有有效帧对齐到参考帧后叠加。"
    widget: file_picker
    accept: ".cr2,.cr3,.arw,.nef,.dng,.rw2,.orf,.raf,.tiff,.tif,.jpeg,.jpg,.png,.bmp,.fits"

routes:
  stacker:
    label: "天空叠加算法"
    widget: tabs
    options:
      mean:
        label: "均值"
        description: "不排除异常值的平均值叠加，计算快，信噪比高，但容易受到干扰。适合无干扰的干净素材。"
      sigma_clip:
        label: "Sigma 裁剪"
        description: "多轮迭代排除异常值后求平均。适合有卫星/飞机线或其他异常值干扰，且叠加图像张数较多(>10张)的场景。"
      median:
        label: "中位数"
        description: "逐像素取中位数，天然排异。适合有卫星/飞机线或其他异常值干扰，且叠加图像张数偏少(<10张)的场景。"
      huber_mean:
        label: "Huber 均值"
        description: "使用 Huber 损失自动降低异常像素权重。速度较快，适合轻微异常场景"
      max_mix:
        label: "最大值混合"
        description: "在最大值基础上校正空间亮度不均，适合需要保留所有飞机/卫星轨迹的场景。"
      max:
        label: "最大值"
        description: "逐像素取最大值，不做其他处理，适合需要保留所有飞机/卫星轨迹的场景。"
  ground_stacker:
    label: "地面叠加算法"
    widget: tabs
    visible_when: { key: "enable_ground", eq: true }
    options:
      mean:
        label: "均值"
        description: "不排除异常值的平均值叠加，速度快，适合稳定、干净的地面区域。"
      sigma_clip:
        label: "Sigma 裁剪"
        description: "迭代排除地面区域中的移动物体或其他异常像素。"
      median:
        label: "中位数"
        description: "逐像素取中位数，适合帧数较少且存在偶发干扰的地面区域。"
      huber_mean:
        label: "Huber 均值"
        description: "自动降低异常像素权重，适合轻微干扰。"
      max_mix:
        label: "最大值混合"
        description: "保留较亮变化并校正空间亮度不均。"
      max:
        label: "最大值"
        description: "逐像素取最大值，不进行异常值抑制。"

configs:
  reference_frame_index:
    label: "参考帧序号"
    description: "从 0 开始计数。所有有效帧会重映射到该帧。"
    widget: input
    min: 0

  lens_type:
    label: "镜头类型"
    description: "自动时从 EXIF 推断；EXIF 不完整时请明确选择标准镜头或鱼眼。"
    widget: select
    options:
      - { value: null, label: "自动（EXIF）" }
      - { value: "perspective", label: "标准镜头" }
      - { value: "fisheye", label: "鱼眼镜头" }

  focal_length_mm:
    label: "镜头焦距（mm）"
    description: "EXIF 不完整时使用的实际焦距。鱼眼镜头允许 BA 从尺度候选进一步修正。"
    widget: input
    visible_when:
      all:
        - { key: "lens_type", neq: null }
    min: 1
    max: 2000

  crop_factor:
    label: "传感器裁切系数"
    description: "全画幅为 1.0；等效焦距 = 实际焦距 × 裁切系数。"
    widget: input
    visible_when:
      all:
        - { key: "lens_type", neq: null }
    min: 0.5
    max: 4.0

  fallback_focal_equiv_mm:
    hidden: true

  optimize_focal:
    label: "联合优化焦距"
    description: "使用全序列匹配共同优化共享焦距。"
    widget: switch

  optimize_distortion:
    label: "联合优化畸变"
    description: "使用全序列匹配共同优化共享畸变；需要足够的边缘星点覆盖。"
    widget: switch

  optimize_principal_point:
    label: "联合优化主点"
    description: "仅在主点存在明确系统偏差时启用，会提高可观测性要求。"
    widget: switch
    hidden: true

  remap_map_scale:
    hidden: true

  int_weight:
    hidden: true
  mask:
    label: "天空遮罩"
    description: "白色区域作为天空并执行 BA 对齐；黑色区域作为地面，保持原始几何后独立叠加。"
    widget: file_picker
    accept: ".tif,.tiff,.png,.jpg"
  enable_ground:
    label: "叠加地面"
    description: "使用天空遮罩的反向区域叠加未经几何变换的地面，并与天空结果重新混合。"
    widget: switch
  distortion:
    hidden: true
  pair_offsets:
    hidden: true
  random_seed:
    hidden: true
  loader_type:
    hidden: true
  loader_configs:
    hidden: true
  exif_reduce_type:
    hidden: true
  output_filename:
    hidden: true
  output_dtype:
    hidden: true
  jpg_quality:
    hidden: true
  png_compressing:
    hidden: true

route_configs:
  "!include": fragments/stacker_route_configs.ui.yaml

layout:
  groups:
    - name: "参考与相机"
      keys:
        [
          reference_frame_index,
          lens_type,
          focal_length_mm,
          crop_factor,
          fallback_focal_equiv_mm,
        ]
    - name: "联合优化"
      keys: [optimize_focal, optimize_distortion, optimize_principal_point]
    - name: "重映射"
      keys: [remap_map_scale]
    - name: "天地分离"
      keys: [mask, enable_ground]
  order:
    [
      stacker,
      ground_stacker,
      reference_frame_index,
      lens_type,
      focal_length_mm,
      crop_factor,
      fallback_focal_equiv_mm,
      optimize_focal,
      optimize_distortion,
      optimize_principal_point,
      remap_map_scale,
      mask,
      enable_ground,
    ]

outputs:
  - "!include": fragments/image_output.ui.yaml
