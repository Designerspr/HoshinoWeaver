name: Tests

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  format-cpp:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: python -m pip install clang-format==20.1.8

      - name: Check C++ and CUDA formatting
        run: python csrc/check_format.py

  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libturbojpeg0-dev

      - name: Build C++ custom ops
        run: python csrc/build_ops.py --compiler gcc

      - name: Run tests (compiled backend)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/ -v --tb=short --cov=hoshicore --cov-report=term-missing -x

      - name: Run tests (numpy fallback)
        env:
          PYTHONPATH: ${{ github.workspace }}
          HNW_CUSTOM_OPS_FALLBACK: numpy
        run: python -m pytest tests/ -v --tb=short -x

  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build C++ custom ops
        run: python csrc/build_ops.py --compiler msvc

      - name: Verify custom ops in clean PyInstaller package
        run: python csrc/verify_packaged_custom_ops.py

      - name: Run tests (compiled backend)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/ -v --tb=short -x

      - name: Run tests (numpy fallback)
        env:
          PYTHONPATH: ${{ github.workspace }}
          HNW_CUSTOM_OPS_FALLBACK: numpy
        run: python -m pytest tests/ -v --tb=short -x

  test-macos-cpu:
    runs-on: macos-15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # pyexiv2 ships a libexiv2.dylib linked against Homebrew inih, so the
          # component tests cannot even be collected without libINIReader.
          brew install libomp inih
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Build OpenMP custom ops without Metal
        run: python csrc/build_ops.py --compiler clang --no-metal

      - name: Verify the build is OpenMP-only with no Metal artifacts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python csrc/verify_no_metal_fallback.py

      - name: Verify custom ops in clean PyInstaller package
        run: python csrc/verify_packaged_custom_ops.py

      - name: Run tests (compiled backend)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/ -v --tb=short -x

      - name: Run tests (numpy fallback)
        env:
          PYTHONPATH: ${{ github.workspace }}
          HNW_CUSTOM_OPS_FALLBACK: numpy
        run: python -m pytest tests/ -v --tb=short -x

  test-macos-metal:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # pyexiv2 ships a libexiv2.dylib linked against Homebrew inih, so the
          # component tests cannot even be collected without libINIReader.
          brew install libomp inih
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Build OpenMP and Metal custom ops
        run: python csrc/build_ops.py --compiler clang

      - name: Verify real Metal runtime and kernel
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python csrc/verify_metal_runtime.py

      # The runtime gate above already gives the Metal-specific fast signal.
      - name: Run tests (compiled backend)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/ -v --tb=short -x

      - name: Verify Metal in clean PyInstaller package
        run: python csrc/verify_packaged_custom_ops.py --require-metal

      # Runs last: it deletes the Metal artifacts the steps above rely on.
      - name: Rebuild without Metal and verify OpenMP fallback
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python csrc/build_ops.py --compiler clang --no-metal
          python csrc/verify_no_metal_fallback.py
